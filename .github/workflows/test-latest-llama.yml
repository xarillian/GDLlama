name: Latest llama.cpp build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCONSFLAGS: -j4

jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Move llama.cpp to its latest master
        run: |
          git -C third-party/llama.cpp fetch origin master
          git -C third-party/llama.cpp checkout --detach FETCH_HEAD
          echo "Testing llama.cpp $(git -C third-party/llama.cpp rev-parse --short HEAD)"
      - uses: ./.github/actions/setup-build
        with:
          cache-tag: latest-llama
          fixtures: 'true'
          llama-cache: 'false'
      - name: Build, which fails if the maintained patch no longer applies
        run: scons test
      - name: Native tests without models
        run: just test --quick
      - name: Native tests with models
        run: just test
