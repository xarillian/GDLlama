name: Godot compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCONSFLAGS: -j4

jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, windows-2022, macos-15 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
        with:
          cache-tag: extension-debug
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Build and stage the native CPU addon
        shell: bash
        run: |
          scons
          python tools/stage_godot.py
      # Godot changes the extension API only in minor releases: check the supported floor and the
      # newest patch of every later minor.
      - name: Check standard and .NET editors
        run: >-
          python tools/check_godot_compatibility.py --editor-only --repetitions 1
          --output bin/godot-compatibility-ci --versions 4.4 4.5.2 4.6.3 4.7.2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: godot-compatibility-${{ matrix.os }}
          path: |
            bin/godot-compatibility-ci/**/results.json
            bin/godot-compatibility-ci/**/*.log
          if-no-files-found: ignore
