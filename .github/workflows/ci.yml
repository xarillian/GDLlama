name: Continuous Integration

on:
  push:
    branches: [ master ]
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - 'SConstruct'
      - 'justfile'
      - 'patches/**'
      - 'tools/**'
      - 'plugin/**'
      - 'tests/**'
      - '.clang-format'
      - '**/.clang-tidy'
      - '.githooks/**'
      - '.gitattributes'
      - '.gitmodules'
      - 'third-party/**'
      - '.github/**'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCONSFLAGS: -j4

jobs:
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - name: clang-format
        run: just style

  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
        with:
          cache-tag: extension-debug
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build the extension, generating the Godot bindings clang-tidy reads
        run: scons
      - name: clang-tidy
        run: just tidy

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
        with:
          cache-tag: test-debug
          fixtures: 'true'
      - name: Build the test binary
        run: scons test
      - name: Native tests without models
        run: just test --quick
      - name: Native tests with models
        run: just test

  test-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
        with:
          backend: vulkan
          cache-tag: test-debug
          fixtures: 'true'
      - name: Install lavapipe, Mesa's software Vulkan driver
        run: sudo apt-get install -y mesa-vulkan-drivers
      - name: Build the Vulkan test binary
        run: scons test use_vulkan=yes
      - name: Native tests without models
        run: just test --quick
      # ggml skips CPU-type Vulkan devices unless one is selected by index.
      - name: GPU model tests on lavapipe
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          GGML_VK_VISIBLE_DEVICES: '0'
        run: just test-gpu

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - name: Tool tests
        run: just test-python

  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
        with:
          cache-tag: extension-debug
          fixtures: 'true'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Build and stage the addon
        run: |
          scons
          python tools/stage_godot.py
      - name: Godot integration suite on the oldest supported Godot
        run: >-
          python tools/check_godot_compatibility.py --repetitions 1
          --output bin/godot-ci --versions 4.4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: godot-suite-logs
          path: |
            bin/godot-ci/**/results.json
            bin/godot-ci/**/*.log
          if-no-files-found: ignore

  sanitize:
    name: sanitize (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        kind: [ thread, address ]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
        with:
          cache-tag: test-${{ matrix.kind }}
      # ThreadSanitizer's shadow memory layout cannot fit the runner kernel's default address randomization.
      - name: Narrow address randomization for ThreadSanitizer
        if: matrix.kind == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Sanitized native tests
        run: just sanitize ${{ matrix.kind }}

  release:
    name: release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu sets the glibc floor for the shipped library.
          - { os: ubuntu-22.04, backend: vulkan, flags: use_vulkan=yes }
          - { os: windows-2022, backend: vulkan, flags: use_vulkan=yes }
          - { os: macos-14, backend: metal, flags: use_metal=yes }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
        with:
          backend: ${{ matrix.backend }}
          cache-tag: extension-release
      - name: Build the release addon
        run: |
          scons target=template_release ${{ matrix.flags }}
          python tools/stage_godot.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chorus-addon-${{ runner.os }}
          path: plugin/addons/chorus
          retention-days: 14
