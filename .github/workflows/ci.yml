name: Continuous Integration

on:
  push:
    branches: [ master ]
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/CMakeLists.txt'
      - 'CMakePresets.json'
      - 'llama.cpp/**'
      - 'godot-cpp/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        build_type: [template_debug, template_release]
        gpu_backend: [cpu, gpu]
        exclude:
          - os: macos-latest
            gpu_backend: gpu
            # GitHub Actions runners usually don't have GPU access for Metal testing, but we can compile it.
          - os: ubuntu-22.04
            gpu_backend: metal
          - os: windows-latest
            gpu_backend: metal

    runs-on: ${{ matrix.os }}

    env:
      VULKAN_VERSION: 1.3.283.0
    
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install scons

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvulkan-dev

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows' && matrix.gpu_backend == 'gpu'
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${{ env.VULKAN_VERSION }}/windows/VulkanSDK-${{ env.VULKAN_VERSION }}-Installer.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_VERSION }}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${{ env.VULKAN_VERSION }}\bin"

      - name: Cache and Download Model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: tests/models
          key: model-gemma-3-270m-it-F16-gguf

      - name: Download Model if not Cached
        if: steps.cache-model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p tests/models
          echo "Downloading model..."
          curl -L "https://huggingface.co/unsloth/gemma-3-270m-it-GGUF/resolve/main/gemma-3-270m-it-F16.gguf" -o tests/models/gemma-3-270m-it-F16.gguf

      - name: Build
        shell: bash
        run: |
          # Determine flags
          SCONS_ARGS="target=${{ matrix.build_type }} -j2"
          
          if [ "${{ matrix.gpu_backend }}" == "gpu" ]; then
            if [ "${{ runner.os }}" == "macOS" ]; then
              SCONS_ARGS="$SCONS_ARGS use_metal=yes"
            else
              SCONS_ARGS="$SCONS_ARGS use_vulkan=yes"
            fi
          fi
          
          echo "Running SCons with: $SCONS_ARGS"
          scons test $SCONS_ARGS
      
      - name: Run Tests
        shell: bash
        run: |
          # On GitHub Actions, Vulkan tests might fail if there is no software rasterizer (llvmpipe) or GPU.
          # We might need to tolerate failure on the GPU run if the runner lacks hardware.
          
          if [ "${{ runner.os }}" == "Windows" ]; then
             ./bin/run_tests.exe
          else
             chmod +x ./bin/run_tests
             ./bin/run_tests
          fi