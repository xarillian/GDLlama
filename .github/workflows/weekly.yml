name: Weekly

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llama:
    uses: ./.github/workflows/test-latest-llama.yml

  godot:
    needs: llama
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/godot-compatibility.yml

  stress:
    uses: ./.github/workflows/stress.yml
